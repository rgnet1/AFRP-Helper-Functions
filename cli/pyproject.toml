[project]
name = "afrp-helper-cli"
version = "1.6.1"
description = "CLI for the AFRP CRM Helper API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "httpx>=0.27"]

[project.scripts]
afrp = "afrp_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["afrp_cli*"]
