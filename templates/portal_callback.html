<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Completing sign-in…</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #fff;
            padding: 24px 32px;
            border-radius: 8px;
            max-width: 420px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Completing sign-in with my.afrp.org…</p>
        <p id="msg" style="color:#666;font-size:14px;"></p>
    </div>
    <form id="complete" method="POST" action="{{ url_for('portal_callback') }}" style="display:none;">
        <input type="hidden" name="id_token" id="id_token">
        <input type="hidden" name="state" id="state">
    </form>
    <script>
        (function () {
            var hash = window.location.hash || '';
            if (hash.charAt(0) === '#') {
                hash = hash.substring(1);
            }
            var fromHash = new URLSearchParams(hash);
            var fromQuery = new URLSearchParams(window.location.search);
            var token = fromHash.get('id_token') || fromHash.get('token') || fromHash.get('access_token')
                || fromQuery.get('id_token') || fromQuery.get('token');
            var state = fromHash.get('state') || fromQuery.get('state') || '';

            if (window.location.search || window.location.hash) {
                history.replaceState({}, '', {{ url_for('portal_callback') | tojson }});
            }

            if (token && state) {
                document.getElementById('id_token').value = token;
                document.getElementById('state').value = state;
                document.getElementById('complete').submit();
                return;
            }
            document.getElementById('msg').textContent =
                'No sign-in token was returned. Try again from the login page.';
            setTimeout(function () {
                window.location.replace({{ url_for('login') | tojson }});
            }, 4000);
        })();
    </script>
</body>
</html>
