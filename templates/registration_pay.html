<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pay - AFRP CRM Helper</title>
    <style>
        body { font-family: Georgia, Palatino, serif; background: #f4f7f4; margin: 0; color: #1c241c; }
        header { background: #3d7a3d; color: #fff; padding: 16px 24px; }
        .wrap { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        iframe { display: block; width: 100%; min-width: 760px; height: 740px; border: 1px solid #e2e8e2; border-radius: 12px; background: #fff; }
        p { font-family: Arial, sans-serif; color: #5c6b5c; }
    </style>
</head>
<body>
<header><h1 style="margin:0;font-size:22px;font-weight:normal;">Pay the difference</h1></header>
<div class="wrap">
    <p>The card form is Authorize.net. This page never sees the card number.</p>
    <iframe id="authnet" name="authnet" title="Authorize.net"></iframe>
    <form id="send" method="POST" action="{{ form_url }}" target="authnet">
        <input type="hidden" name="token" value="{{ token }}">
    </form>
    <form id="done" method="POST" action="{{ url_for('registration_payment_done') }}">
        <input type="hidden" name="trans_id" id="trans_id">
    </form>
</div>
<script>
function decodePart(value) {
    try { return decodeURIComponent(String(value || "").replace(/\+/g, " ")); }
    catch (e) { return unescape(value || ""); }
}
function readParams(query) {
    var raw = query && typeof query === "object" ? (query.qstr || "") : String(query || "");
    if (raw.charAt(0) === "?" || raw.charAt(0) === "#") raw = raw.slice(1);
    var params = {};
    var action = raw.match(/(?:^|&)action=([^&]*)/);
    var width = raw.match(/(?:^|&)width=([^&]*)/);
    var height = raw.match(/(?:^|&)height=([^&]*)/);
    var response = raw.match(/(?:^|&)response=([\s\S]*)$/);
    if (action) params.action = decodePart(action[1]);
    if (width) params.width = decodePart(width[1]);
    if (height) params.height = decodePart(height[1]);
    if (response) params.response = decodePart(response[1]);
    return params;
}
var paymentFinished = false;
window.CommunicationHandler = {
    onReceiveCommunication: function (query) {
        if (paymentFinished) return;
        var params = readParams(query);
        var frame = document.getElementById("authnet");
        if (params.action === "resizeWindow") {
            var width = parseInt(params.width, 10);
            var height = parseInt(params.height, 10);
            if (width >= 450 && width < 760) width = 900;
            if (width > 100) frame.style.width = width + "px";
            if (height > 100) frame.style.height = height + "px";
            return;
        }
        if (params.action === "cancel") {
            paymentFinished = true;
            window.location = {{ cancel_to|tojson }};
            return;
        }
        if (params.action !== "transactResponse") return;
        var response = {};
        try { response = JSON.parse(params.response || "{}"); } catch (e) { response = {}; }
        var transId = response.transId || "";
        if (!transId) {
            var match = /"transId"\s*:\s*"([^"]+)"/.exec(params.response || "");
            transId = match ? match[1] : "";
        }
        if (!transId || (response.responseCode && response.responseCode !== "1")) return;
        paymentFinished = true;
        document.getElementById("trans_id").value = transId;
        document.getElementById("done").submit();
    }
};
window.addEventListener("message", function (event) {
    if (event.origin !== window.location.origin) return;
    if (typeof event.data !== "string" || event.data.indexOf("action=") === -1) return;
    window.CommunicationHandler.onReceiveCommunication(event.data);
});
document.getElementById("send").submit();
</script>
</body>
</html>
