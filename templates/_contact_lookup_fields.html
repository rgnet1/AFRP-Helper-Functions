<div>
    <label class="field" for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" placeholder="name@example.com">
</div>
<div>
    <label class="field" for="first_name">First name</label>
    <input id="first_name" type="text" name="first_name" value="{{ first_name or '' }}" placeholder="First">
</div>
<div>
    <label class="field" for="last_name">Last name</label>
    <input id="last_name" type="text" name="last_name" value="{{ last_name or '' }}" placeholder="Last">
</div>
