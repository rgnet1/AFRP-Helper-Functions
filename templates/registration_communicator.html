<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <script>
        function callParentFunction(str) {
            var handler = window.parent && window.parent.parent &&
                window.parent.parent.CommunicationHandler;
            if (str && handler && handler.onReceiveCommunication) {
                handler.onReceiveCommunication(str);
            }
        }
        function receiveMessage(event) {
            if (event && event.data) {
                callParentFunction(typeof event.data === "string" ? event.data : "");
            }
        }
        if (window.addEventListener) {
            window.addEventListener("message", receiveMessage, false);
        }
        if (window.location.hash && window.location.hash.length > 1) {
            callParentFunction(window.location.hash.substring(1));
        }
    </script>
</head>
<body></body>
</html>
