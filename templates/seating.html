<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seating - AFRP CRM Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/motion.css') }}">
    <style>
        :root { --green: #3d7a3d; --ink: #1c241c; --muted: #5c6b5c; --line: #e2e8e2; --paper: #f4f7f4; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Georgia, "Iowan Old Style", Palatino, serif;
            color: var(--ink);
            background: #f2f2f7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        }
        header { background: var(--green); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-family: Arial, sans-serif; font-size: 14px; }
        h1 { margin: 0; font-size: 22px; font-weight: normal; }
        .layout { display: grid; grid-template-columns: 260px 1fr 340px; gap: 16px; padding: 20px; align-items: start; }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .side { position: static; max-height: none; } }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
        button, input, select { font-family: Arial, sans-serif; font-size: 14px; }
        .event { display: block; width: 100%; text-align: left; background: #f4f7f4; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
        .event.current { background: var(--green); color: #fff; border-color: var(--green); }
        .main-event { background: #fff; font-weight: bold; }
        .expand-hint { display: block; margin-top: 4px; font-family: Arial, sans-serif; font-size: 12px; font-weight: normal; color: var(--muted); }
        .main-event.current .expand-hint, .event.current .expand-hint { color: #e7f2e7; }
        .sub-events { margin: 0 0 8px 14px; }
        .sub-event { background: #f7faf7; }
        .chart { background: #fbfbfb; border-radius: 12px; min-height: 180px; }
        .floor { width: 100%; height: auto; display: block; }
        .table-dot { cursor: pointer; --kind: #5b8def; }
        .kind-general { --kind: #5b8def; }
        .kind-afrp { --kind: #2a9d8f; }
        .kind-board { --kind: #7c5cbf; }
        .kind-sponsor { --kind: #e0a106; }
        .kind-local { --kind: #e07a3d; }
        .kind-leadership { --kind: #3d4c9e; }
        .kind-vip { --kind: #8e3d5b; }
        .kind-head { --kind: #efe6c9; }
        .kind-guest { --kind: #8e7cc3; }
        .kind-emergency { --kind: #6e7c86; }
        .kind-other { --kind: #c5c9c4; }
        .table-dot circle, .table-dot.head rect { fill: var(--kind); stroke: #2f7d46; stroke-width: 0.55; }
        .table-dot.full circle, .table-dot.full rect { stroke: #a33b3b; }
        .table-dot.current circle, .table-dot.current rect,
        .table-dot.open circle, .table-dot.open rect { stroke-width: 1.05; }
        .table-dot.queued circle, .table-dot.queued rect { stroke-dasharray: 0.9 0.45; }
        .table-dot text { fill: #1c241c; font-family: Arial, sans-serif; pointer-events: none; }
        .table-dot.kind-afrp text, .table-dot.kind-board text, .table-dot.kind-leadership text,
        .table-dot.kind-vip text, .table-dot.kind-emergency text { fill: #fff; }
        .open-badge { fill: #c0392b; stroke: #fff; pointer-events: none; }
        .table-dot .open-badge-num { fill: #fff; font-family: Arial, sans-serif; font-weight: 700; pointer-events: none; }
        .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
        .stats[hidden] { display: none; }
        .stat { background: #f7faf7; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
        .stat b { display: block; font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1; color: var(--ink); }
        .stat span { display: block; margin-top: 4px; font-family: Arial, sans-serif; font-size: 12px; line-height: 1.3; color: var(--muted); }
        @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 0 0 10px; }
        .legend[hidden] { display: none; }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; font-family: Arial, sans-serif; font-size: 13px; color: var(--ink); }
        .legend-swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--kind, #5b8def); box-shadow: inset 0 0 0 2px #2f7d46; }
        .dance-floor { fill: #d5dbe3; stroke: #b7c0cc; stroke-width: 0.35; }
        .stage-floor { fill: #d9dde3; stroke: #8b93a0; stroke-width: 0.4; }
        .landmark { fill: #5c6b5c; font-family: Arial, sans-serif; font-size: 2.4px; }
        .side {
            position: sticky;
            top: 12px;
            max-height: calc(100vh - 96px);
            overflow: auto;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border: 0.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .pending-badge {
            display: inline-flex;
            margin: 0 0 12px auto;
            background: rgba(61, 122, 61, 0.14);
            color: #245124;
            border-radius: 999px;
            padding: 4px 10px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
        }
        .pending-badge[hidden] { display: none; }
        .side-banner { display: flex; }
        .table-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
        .table-name, .tip-name {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }
        .table-name { margin: 0; font-size: 22px; }
        .table-count, .tip-count {
            margin-left: auto;
            flex: 0 0 auto;
            font-family: Fraunces, Georgia, serif;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #2f632f;
            white-space: nowrap;
        }
        .table-count { font-size: 15px; }
        .tip {
            position: fixed;
            z-index: 30;
            left: 0;
            top: 0;
            width: max-content;
            min-width: 220px;
            max-width: 280px;
            pointer-events: none;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border: 0.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.96);
            transition: opacity var(--motion-duration, 180ms) var(--motion-ease, ease), transform var(--motion-duration, 180ms) var(--motion-ease, ease), visibility 0s linear var(--motion-duration, 180ms);
        }
        .tip.is-on {
            opacity: 1;
            visibility: visible;
            transform: none;
            transition: opacity var(--motion-duration, 180ms) var(--motion-ease, ease), transform var(--motion-duration, 180ms) var(--motion-ease, ease), visibility 0s;
        }
        .tip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 14px 6px; }
        .tip-name { font-size: 18px; }
        .tip-count { font-size: 14px; }
        .tip-people { margin: 0; padding: 4px 14px 12px 32px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 15px; line-height: 1.35; }
        .tip-people li { padding: 1px 0; }
        .tip-kind { margin: 0; padding: 0 14px 8px; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; color: var(--ink); }
        .tip-empty, .table-empty { margin: 0; font-family: Georgia, Palatino, serif; font-size: 14px; color: var(--muted); }
        .tip-empty { padding: 2px 14px 12px; }
        .table-empty { padding: 6px 0 4px; }
        .seat-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; }
        .seat-row, .person {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            background: transparent;
            border: 0;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            color: inherit;
        }
        .seat-row:hover, .person:hover { background: rgba(61, 122, 61, 0.08); }
        .seat-row.selected { background: rgba(61, 122, 61, 0.16); box-shadow: inset 0 0 0 1px rgba(61, 122, 61, 0.35); }
        .seat-num { font-family: Fraunces, Georgia, serif; font-weight: 700; color: #3d7a3d; min-width: 1.25em; }
        .seat-who { display: flex; flex-direction: column; min-width: 0; }
        .seat-person { font-family: Georgia, Palatino, serif; font-size: 15px; }
        .seat-email { font-family: Arial, sans-serif; font-size: 12px; color: var(--muted); }
        .seat-flag { margin-left: auto; font-family: Arial, sans-serif; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #8a7340; }
        .mover { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(226, 232, 226, 0.95); }
        #guest-lookup[hidden] { display: none; }
        label { display: block; font-family: Arial, sans-serif; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #c9d4c9; border-radius: 8px; background: rgba(255, 255, 255, 0.8); }
        .hint { margin: 6px 0 0; }
        .primary { background: #007aff; color: #fff; border: 0; border-radius: 14px; padding: 12px 14px; cursor: pointer; margin-top: 12px; width: 100%; font-weight: 600; }
        .primary:disabled { opacity: 0.55; cursor: default; }
        .primary.is-busy, .primary.is-busy:disabled { opacity: 0.8; cursor: wait; }
        .primary.is-done { background: #245124; }
        .primary.is-error { animation: motion-shake var(--motion-duration, 180ms) var(--motion-ease, ease); }
        .pending-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 16px 0 6px; }
        .pending-head h3 { margin: 0; font-size: 15px; font-weight: normal; }
        .pending-card {
            background: rgba(255, 255, 255, 0.66);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 8px;
            box-shadow: 0 10px 24px rgba(28, 36, 28, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }
        .pending-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .pending-name { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 16px; }
        .remove-move { border: 0; background: transparent; color: #8a3b3b; cursor: pointer; font-family: Arial, sans-serif; font-size: 12px; padding: 0; }
        .compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; margin-top: 8px; }
        .compare-label { display: block; font-family: Arial, sans-serif; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
        .compare-value { display: block; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 14px; line-height: 1.2; }
        .compare-value.before { color: #5c6b5c; }
        .compare-value.after { color: #2f632f; }
        .compare-arrow { color: #8a7340; font-size: 18px; padding-bottom: 1px; }
        .error { color: #8a3b3b; font-family: Arial, sans-serif; font-size: 14px; }
        .meta { font-family: Arial, sans-serif; font-size: 13px; color: var(--muted); }
        .moving-status {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0 0 14px;
            padding: 14px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            color: #142014;
            background: rgba(61, 122, 61, 0.16);
            border: 1px solid rgba(61, 122, 61, 0.42);
            border-radius: 12px;
        }
        .moving-name { font-size: 26px; }
        .moving-detail {
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
            color: #142014;
        }
        .banquet-switch { margin: 0 0 12px; }
        .banquet-switch[hidden] { display: none; }
        .banquet-switch .banquet-label {
            display: block;
            margin: 0 0 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }
        .meal-head {
            margin: 12px 0 4px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .meal-q { margin-top: 8px; }
        .meal-q label { margin-top: 0; color: var(--ink); font-size: 13px; font-weight: 700; }
        .meal-note {
            margin: 4px 0 0;
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            color: var(--muted);
            overflow-wrap: anywhere;
        }
        .compare-value { overflow-wrap: anywhere; }
    </style>
</head>
<body>
{% set page_title = "Seating" %}
{% include "_app_header.html" %}
<div class="layout">
    <section class="card">
        <h2 style="margin:0 0 10px;font-size:16px;font-weight:normal;">Events with a seating chart</h2>
        <div id="events" class="meta">Loading…</div>
    </section>
    <section class="card">
        <h2 id="event-title" style="margin:0 0 10px;font-size:18px;font-weight:normal;">Choose an event</h2>
        <div id="stats" class="stats" hidden></div>
        <div id="legend" class="legend" hidden></div>
        <div id="chart" class="chart" hidden></div>
    </section>
    <section class="card side" id="side">
        <div class="side-banner">
            <span id="pending-badge" class="pending-badge" hidden>0 pending</span>
        </div>
        <div id="table-panel">
            <p class="meta">Choose an event, then click a table.</p>
        </div>
        <div class="mover">
            <p id="picked" class="meta"></p>
            <div id="banquet-switch" hidden></div>
            <div id="guest-lookup">
                <label for="guest-search" id="guest-label">Person on this event</label>
                <input id="guest-search" placeholder="Name or email" autocomplete="off" disabled>
                <div id="guest-results"></div>
            </div>
            <label for="seat-select">New table</label>
            <select id="seat-select" disabled>
                <option value="">Choose a table…</option>
            </select>
            <p class="meta hint">Or click a table on the chart.</p>
        </div>
        <div id="pending-wrap"></div>
        <button id="approve" class="primary" type="button" disabled>Approve and move</button>
        <p id="seat-error" class="error"></p>
        <p id="seat-note" class="meta"></p>
    </section>
</div>
<div id="tip" class="tip" aria-hidden="true"></div>
<script>
var state = {
    eventId: "",
    eventName: "",
    parentId: "",
    parentName: "",
    events: [],
    selected: null,
    openTableId: "",
    board: null,
    pending: [],
    pendingAnimated: {},
    questionsByEvent: {},
    saving: false,
    note: "",
    seatError: "",
    saveFlash: ""
};
var tip = document.getElementById("tip");
var svgNS = "http://www.w3.org/2000/svg";
var searchToken = 0;

function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
}
function countLabel(table) {
    var seated = table.seated || 0;
    if (table.chairs) return seated + " of " + table.chairs;
    return seated + " seated";
}
function sortedPeople(table) {
    return (table.people || []).slice().sort(function (a, b) {
        return String(a.name || "").localeCompare(String(b.name || ""), undefined, {sensitivity: "base"});
    });
}
function findTable(id) {
    var tables = (state.board && state.board.tables) || [];
    var key = (id || "").toLowerCase();
    for (var i = 0; i < tables.length; i++) {
        if ((tables[i].id || "").toLowerCase() === key) return tables[i];
    }
    return null;
}
function seatOf(contactId) {
    var key = (contactId || "").toLowerCase();
    var tables = (state.board && state.board.tables) || [];
    for (var i = 0; i < tables.length; i++) {
        var people = tables[i].people || [];
        for (var j = 0; j < people.length; j++) {
            if ((people[j].id || "").toLowerCase() === key) return {table: tables[i], person: people[j]};
        }
    }
    return null;
}
function pendingFor(contactId) {
    var key = (contactId || "").toLowerCase();
    for (var i = 0; i < state.pending.length; i++) {
        if (state.pending[i].contactId.toLowerCase() === key) return state.pending[i];
    }
    return null;
}
function seatText(table) {
    var count = table.chairs ? " · " + table.seated + " of " + table.chairs : "";
    var extra = (table.vip ? " · VIP" : "") + (table.available ? "" : " · full");
    return table.name + count + extra;
}
function tableNumber(table) {
    if (table.name && table.name.toLowerCase().indexOf("head") >= 0) return "Head";
    if (table.number) return String(table.number);
    var match = String(table.name || "").match(/\d+/);
    return match ? match[0] : "";
}
function hideTip() {
    tip.classList.remove("is-on");
}
var KIND_ORDER = ["general", "afrp", "board", "sponsor", "local", "leadership", "vip", "head", "guest", "emergency", "other"];
function typeLine(table) {
    var label = table.kind_label || "General";
    var detail = table.kind_detail || "";
    if (detail && detail.toLowerCase() !== label.toLowerCase()) return label + " · " + detail;
    return label;
}
function paintStats(board) {
    var box = document.getElementById("stats");
    var tables = (board && board.tables) || [];
    if (!board || !board.live || !tables.length) {
        box.hidden = true;
        box.innerHTML = "";
        return;
    }
    var full = 0;
    var guests = 0;
    var chairs = 0;
    var generalOpen = 0;
    tables.forEach(function (table) {
        var taken = table.seated || 0;
        guests += taken;
        if (table.chairs) {
            chairs += table.chairs;
            if (taken >= table.chairs) full += 1;
        }
        if ((table.kind || "general") === "general" && table.open_seats > 0) generalOpen += table.open_seats;
    });
    var percent = chairs ? Math.round(100 * guests / chairs) : null;
    var figures = [
        [String(full), "Full tables"],
        [String(guests), "Guests"],
        [percent == null ? "—" : percent + "%", "Full"],
        [String(generalOpen), "General seats open"]
    ];
    box.innerHTML = "";
    figures.forEach(function (figure) {
        var card = el("div", "stat");
        card.appendChild(el("b", "", figure[0]));
        card.appendChild(el("span", "", figure[1]));
        box.appendChild(card);
    });
    box.hidden = false;
}
function paintLegend(tables) {
    var box = document.getElementById("legend");
    var seen = {};
    var items = [];
    (tables || []).forEach(function (table) {
        var key = table.kind || "general";
        var label = table.kind_label || "General";
        var id = key === "other" ? "other:" + label : key;
        if (seen[id]) return;
        seen[id] = true;
        items.push({key: key, label: label});
    });
    items.sort(function (a, b) {
        var ai = KIND_ORDER.indexOf(a.key);
        var bi = KIND_ORDER.indexOf(b.key);
        if (ai < 0) ai = KIND_ORDER.length;
        if (bi < 0) bi = KIND_ORDER.length;
        return ai - bi || a.label.localeCompare(b.label);
    });
    box.innerHTML = "";
    box.hidden = !items.length;
    items.forEach(function (item) {
        var row = el("span", "legend-item");
        row.appendChild(el("span", "legend-swatch kind-" + item.key));
        row.appendChild(document.createTextNode(item.label));
        box.appendChild(row);
    });
}
function renderTip(table) {
    tip.innerHTML = "";
    var head = el("div", "tip-head");
    head.appendChild(el("div", "tip-name", table.name || "Table"));
    head.appendChild(el("div", "tip-count", countLabel(table)));
    tip.appendChild(head);
    tip.appendChild(el("p", "tip-kind", typeLine(table)));
    var people = sortedPeople(table);
    if (!people.length) {
        tip.appendChild(el("p", "tip-empty", "Empty"));
        return;
    }
    var list = el("ol", "tip-people");
    people.forEach(function (person) {
        list.appendChild(el("li", "", person.name || "Guest"));
    });
    tip.appendChild(list);
}
function placeTip(event) {
    tip.classList.add("is-on");
    var margin = 12;
    var offset = 16;
    var width = tip.offsetWidth;
    var height = tip.offsetHeight;
    var x = event.clientX + offset;
    var y = event.clientY + offset;
    if (x + width > window.innerWidth - margin) x = event.clientX - width - offset;
    if (y + height > window.innerHeight - margin) y = event.clientY - height - offset;
    x = Math.max(margin, Math.min(x, window.innerWidth - width - margin));
    y = Math.max(margin, Math.min(y, window.innerHeight - height - margin));
    tip.style.left = x + "px";
    tip.style.top = y + "px";
}
function pendingLabel(count) {
    return count === 1 ? "1 pending" : count + " pending";
}
function idsMatch(left, right) {
    return (left || "").toLowerCase() === (right || "").toLowerCase();
}
function sameBanquet(move) {
    var fromEvent = move.fromEventId || state.eventId || "";
    var toEvent = move.toEventId || state.eventId || "";
    return idsMatch(fromEvent, toEvent);
}
function isCross(move) {
    return !!(move.fromEventId && move.toEventId && !idsMatch(move.fromEventId, move.toEventId));
}
function placeLabel(eventName, tableName, includeEvent) {

                var count = document.createElementNS(svgNS, "text");
                count.setAttribute("class", "open-badge-num");
                count.setAttribute("x", badgeX);
                count.setAttribute("y", badgeY);
                count.setAttribute("text-anchor", "middle");
                count.setAttribute("dominant-baseline", "central");
                count.setAttribute("font-size", badgeR * (table.open_seats > 9 ? 0.82 : 1.05));
                count.textContent = String(table.open_seats);
                group.appendChild(badge);
                group.appendChild(count);
            }
            group.addEventListener("mouseenter", function (event) {
                renderTip(table);
                placeTip(event);
            });
            group.addEventListener("mousemove", function (event) { placeTip(event); });
            group.addEventListener("mouseleave", hideTip);
            group.addEventListener("click", function () { openTable(table); });
            svg.appendChild(group);
        });
        chart.appendChild(svg);
        paintLegend(placed.map(function (spot) { return byId[spot.id]; }).filter(Boolean));
    }
    paintStats(board);
    paintSide();
}
function showLoading() {
    var chart = document.getElementById("chart");
    chart.hidden = false;
    chart.innerHTML = "";
    chart.appendChild(el("p", "meta", "Loading seating chart…"));
    document.getElementById("legend").hidden = true;
    document.getElementById("stats").hidden = true;
    hideTip();
}
function markCurrentEvent(eventId) {
    var key = (eventId || "").toLowerCase();
    document.querySelectorAll(".sub-event").forEach(function (item) {
        if (item.classList.contains("banquet-choice")) return;
        var match = (item.getAttribute("data-event-id") || "").toLowerCase() === key;
        item.classList.toggle("current", match);
        if (!match) return;
        var subs = item.parentElement;
        if (subs) {
            subs.hidden = false;
            var hint = subs.previousElementSibling && subs.previousElementSibling.querySelector(".expand-hint");
            if (hint) hint.textContent = "Click to collapse";
        }
    });
}
function beginChart(eventId, name, parent, eventName, keep) {
    state.eventId = eventId;
    state.eventName = eventName || "";
    state.parentId = (parent && parent.id) || "";
    state.parentName = (parent && parent.name) || "";
    state.openTableId = "";
    state.board = null;
    state.paintedId = 0;
    state.inflight = false;
    state.loadId = (state.loadId || 0) + 1;
    if (!keep) {
        state.selected = null;
        state.pending = [];
        state.pendingAnimated = {};
        state.saving = false;
        state.note = "";
        state.seatError = "";
        state.saveFlash = "";
        document.getElementById("guest-search").value = "";
        document.getElementById("guest-results").innerHTML = "";
        var wrap = document.getElementById("pending-wrap");
        if (wrap) wrap.removeAttribute("data-sig");
    }
    document.getElementById("event-title").textContent = name;
    document.getElementById("guest-search").disabled = false;
    markCurrentEvent(eventId);
    paintSide();
    showLoading();
    refresh(true);
}
function openEvent(eventId, name, parent, eventName) {
    beginChart(eventId, name, parent, eventName, false);
}
function switchBanquet(eventId, name, parent, eventName) {
    beginChart(eventId, name, parent, eventName, true);
}
function refresh(sketch) {
    if (!state.eventId || state.inflight && !sketch) return;
    var loadId = state.loadId || 0;
    var url = "/api/seating/" + state.eventId;
    if (sketch) url += "?sketch=1";
    if (!sketch) state.inflight = true;
    fetch(url).then(function (r) { return r.json(); }).then(function (board) {
        if (loadId !== (state.loadId || 0)) return;
        if (!sketch && board && !board.error) state.paintedId = loadId;
        if (sketch && state.paintedId === loadId) return;
        if (board.error) {
            state.seatError = board.error;
            showLoading();
            var meta = document.querySelector("#chart .meta");
            if (meta) meta.textContent = board.error;
            renderPending();
            return;
        }
        draw(board);
    }).finally(function () {
        if (!sketch) state.inflight = false;
    });
    if (sketch) refresh(false);
}
function approveMoves() {
    if (state.saving || !state.pending.length || !state.eventId || questionsWaiting()) return;
    state.saving = true;
    state.seatError = "";
    state.note = "";
    state.saveFlash = "";
    paintSide();
    var moves = state.pending.map(function (move) {
        return {
            contact_id: move.contactId,
            table_id: move.toId,
            from_event_id: move.fromEventId || state.eventId,
            to_event_id: move.toEventId || state.eventId,
            answers: answerList(move)
        };
    });
    fetch("/api/seating/" + state.eventId + "/assign-batch", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({moves: moves})
    }).then(function (response) {
        return response.json().then(function (data) {
            return {ok: response.ok, data: data || {}};
        });
    }).then(function (result) {
        var data = result.data || {};
        var applied = data.applied || [];
        if (applied.length) {
            var done = {};
            applied.forEach(function (id) { done[String(id).toLowerCase()] = true; });
            state.pending = state.pending.filter(function (move) {
                return !done[move.contactId.toLowerCase()];
            });
        }
        state.saving = false;
        if (!result.ok || data.error) {
            state.seatError = data.error || "Could not change the seat";
            state.saveFlash = "error";
            if (data.tables) draw(data);
            else {
                paintSide();
                refresh(false);
            }
            return;
        }
        state.pending = [];
        state.pendingAnimated = {};
        state.selected = null;
        state.saveFlash = "done";
        state.note = applied.length === 1 ? "Moved 1 person." : "Moved " + applied.length + " people.";
        var pendingWrap = document.getElementById("pending-wrap");
        if (pendingWrap) pendingWrap.removeAttribute("data-sig");
        if (data.tables) draw(data);
        else {
            paintSide();
            refresh(false);
        }
        setTimeout(function () {
            if (state.saveFlash === "done") {
                state.saveFlash = "";
                renderPending();
            }
        }, 1400);
    }).catch(function () {
        state.saving = false;
        state.seatError = "Could not change the seat";
        state.saveFlash = "error";
        paintSide();
    });
}
var guestSearchTimer = null;
document.getElementById("guest-search").addEventListener("input", function () {
    var query = this.value.trim();
    var token = ++searchToken;
    clearTimeout(guestSearchTimer);
    if (!state.eventId || query.length < 2) {
        document.getElementById("guest-results").innerHTML = "";
        return;
    }
    guestSearchTimer = setTimeout(function () {
        fetch("/api/seating/" + state.eventId + "/guests?q=" + encodeURIComponent(query))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (token !== searchToken) return;
                var box = document.getElementById("guest-results");
                box.innerHTML = "";
                (data.guests || []).forEach(function (guest) {
                    var button = el("button", "person");
                    button.type = "button";
                    button.textContent = guest.name + (guest.email ? " · " + guest.email : "");
                    button.addEventListener("click", function () { selectPerson(guest, null); });
                    box.appendChild(button);
                });
            });
    }, 300);
});
document.getElementById("seat-select").addEventListener("change", function () {
    if (!state.selected) return;
    var table = findTable(this.value);
    if (!table) return;
    queueMove(state.selected, table);
    state.selected = null;
    paintSide();
});
document.getElementById("approve").addEventListener("click", approveMoves);
loadEvents();
setInterval(function () {
    if (document.hidden) return;
    refresh(false);
}, 12000);
document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.eventId) refresh(false);
});
</script>
